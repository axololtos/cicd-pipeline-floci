<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1000px;height:420px;overflow:hidden}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#fff;
  background:
   radial-gradient(600px 300px at 85% 10%,rgba(99,102,241,.35),transparent 70%),
   radial-gradient(500px 260px at 5% 100%,rgba(16,185,129,.25),transparent 70%),
   #0b1020;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px}
.wrap{position:absolute;left:60px;right:60px;top:42px}
.tag{display:inline-block;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc;border:1px solid rgba(125,211,252,.4);border-radius:999px;padding:6px 14px}
h1{font-size:60px;line-height:1.04;font-weight:800;margin-top:18px;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#34d399,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:22px;color:#cbd5e1;margin-top:14px}
.pipe{position:absolute;left:60px;right:60px;bottom:38px;display:flex;align-items:center;gap:0}
.st{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 20px;min-width:170px}
.st b{display:block;font-size:20px}
.st small{display:block;font-size:14px;color:#94a3b8;margin-top:2px}
.st i{font-style:normal;color:#34d399;margin-left:8px}
.ar{flex:1;height:2px;background:linear-gradient(90deg,#60a5fa,#34d399);position:relative;min-width:30px}
.ar:after{content:"";position:absolute;right:-1px;top:-5px;border-left:10px solid #34d399;border-top:6px solid transparent;border-bottom:6px solid transparent}
.badge{position:absolute;right:60px;top:46px;text-align:right;font-size:15px;color:#a7f3d0}
.badge b{display:block;font-size:30px;color:#fff}
</style></head><body>
<div class="grid"></div>
<div class="badge"><b>$0</b>no AWS account</div>
<div class="wrap">
  <span class="tag">DevOps &middot; Local &middot; Docker</span>
  <h1>Run AWS CI/CD<br><span>on your own laptop</span></h1>
  <div class="sub">CodePipeline &middot; CodeBuild &middot; CodeDeploy with Floci</div>
</div>
<div class="pipe">
  <div class="st"><b>Source<i>&#10003;</i></b><small>GitHub</small></div><div class="ar"></div>
  <div class="st"><b>Build<i>&#10003;</i></b><small>CodeBuild &rarr; WAR</small></div><div class="ar"></div>
  <div class="st"><b>Deploy<i>&#10003;</i></b><small>CodeDeploy &rarr; EC2</small></div><div class="ar"></div>
  <div class="st"><b>Live<i>&#10003;</i></b><small>localhost:30000</small></div>
</div>
</body></html>
